<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小工具">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>小工具</title>
<style>
:root {
    --bg: #121212;
    --card: #1c1c1e;
    --card-2: #242426;
    --line: #333336;
    --text: #f2f2f7;
    --muted: #8e8e93;
    --accent: #0a84ff;
    --accent-soft: rgba(10, 132, 255, 0.16);
    --green: #30d158;
    --red: #ff453a;
    --radius: 14px;
    --nav-h: 58px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    color-scheme: dark;
    overscroll-behavior-y: none;
}
.app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
}
@media (min-width: 560px) {
    body { background: #000; }
    .app { min-height: 100vh; box-shadow: 0 0 0 1px #2a2a2c; }
}
.topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    background: rgba(18, 18, 18, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}
.topbar h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: 0.5px; }
.topbar .sub { color: var(--muted); font-size: 12.5px; }

main {
    flex: 1 1 auto;
    padding: 12px 12px calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));
}
.view { display: none; }
.view.active { display: block; animation: fade 0.16s ease-out; }
@keyframes fade { from { opacity: 0.4; } to { opacity: 1; } }

.card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 10px;
}
.card-title { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--muted); }

input, textarea, select, button { font-family: inherit; font-size: 16px; }
input[type="date"], input[type="number"], textarea, .dt-input {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card-2);
    color: var(--text);
    padding: 11px 12px;
    min-height: 46px;
    outline: none;
}
input[type="date"]:focus, input[type="number"]:focus, textarea:focus, .dt-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
}
input[type="number"] { -moz-appearance: textfield; appearance: textfield; text-align: center; }
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
button {
    border: 1px solid var(--line);
    background: var(--card-2);
    color: var(--text);
    border-radius: 10px;
    min-height: 46px;
    padding: 10px 14px;
    cursor: pointer;
    touch-action: manipulation;
}
button:active { transform: scale(0.985); filter: brightness(1.15); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.ghost { background: transparent; }
button.block { width: 100%; }

/* 日历 */
.jump-row { display: flex; gap: 8px; }
.jump-row input { flex: 1 1 auto; min-width: 0; }
.jump-row button { flex: 0 0 auto; padding: 10px 16px; }
.jump-row input { font-variant-numeric: tabular-nums; letter-spacing: 0.5px; }
.jump-row input.invalid { border-color: var(--red); box-shadow: 0 0 0 3px rgba(255, 69, 58, 0.16); }
.jump-hint { margin: 6px 2px 0; font-size: 11.5px; line-height: 1.5; color: var(--muted); }
.jump-hint.err { color: var(--red); }
.chips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
.chips button { padding: 8px 2px; font-size: 13px; min-height: 40px; color: #c7c7cc; }
.cal-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.nav-btn {
    width: 44px; height: 44px; padding: 0;
    font-size: 22px; line-height: 1;
    background: transparent; border-color: transparent; color: var(--muted);
}
.cal-title { flex: 1 1 auto; text-align: center; font-size: 17px; font-weight: 700; letter-spacing: 1px; }
.weekdays, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.weekdays { gap: 2px; margin-bottom: 4px; }
.weekdays div { text-align: center; font-size: 11px; color: var(--muted); padding: 2px 0; }
.weekdays .we { color: #ff8080; }
.cal-grid { gap: 2px; }
.cal-cell {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1px;
    min-height: 47px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: var(--card-2);
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
}
.cal-cell:active { background: #3a3a3e; }
.cal-cell .num { font-size: 15px; line-height: 1.1; }
.cal-cell .lunar {
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 9px; line-height: 1.2; color: var(--muted);
}
.cal-cell.weekend .num { color: #ff9a9a; }
.cal-cell.other { opacity: 0.38; }
.cal-cell.today { border-color: var(--green); }
.cal-cell.today .num { color: var(--green); font-weight: 700; }
.cal-cell.selected { background: var(--accent); border-color: var(--accent); }
.cal-cell.selected .num, .cal-cell.selected .lunar { color: #fff; }
.cal-cell .lunar.term { color: #4ec9b0; }

.info-line { margin: 2px 0; font-size: 13px; color: #c7c7cc; }
.info-line b { color: var(--text); }
.info-actions { margin-top: 10px; display: flex; gap: 8px; }
.info-actions button { flex: 1 1 0; font-size: 14px; }

/* 日期加减 */
.field-label { display: block; margin: 0 0 6px; font-size: 12.5px; color: var(--muted); }
.quick-row { display: flex; gap: 8px; margin-top: 8px; }
.quick-row button { flex: 1 1 0; font-size: 14px; min-height: 42px; color: #c7c7cc; }
.stepper { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.stepper-label { flex: 0 0 34px; font-size: 13.5px; color: var(--muted); }
.stepper input { flex: 1 1 auto; }
.step {
    flex: 0 0 46px; width: 46px; height: 46px; padding: 0;
    font-size: 22px; line-height: 1; color: var(--text);
}
.result-card { background: linear-gradient(180deg, #1f2633, #1c1c1e); }
.result-date { font-size: 30px; font-weight: 700; letter-spacing: 0.5px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.result-meta { margin-top: 6px; font-size: 13px; color: #c7c7cc; line-height: 1.7; }
.result-actions { margin-top: 12px; display: flex; gap: 8px; }
.result-actions button { flex: 1 1 0; font-size: 14px; }

/* 时间间隔 */
.dt-input { font-variant-numeric: tabular-nums; letter-spacing: 0.4px; }
.dt-input.invalid { border-color: var(--red); box-shadow: 0 0 0 3px rgba(255, 69, 58, 0.16); }
.iv-field + .iv-field { margin-top: 12px; }
.iv-range { font-size: 12.5px; line-height: 1.75; color: var(--muted); font-variant-numeric: tabular-nums; }
.iv-range span { display: inline-block; min-width: 34px; color: #6d6d72; }
.iv-range b { font-weight: 600; color: #d0d0d5; }
.iv-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 8px 0 2px; }
.iv-cell { background: var(--card-2); border-radius: 10px; padding: 9px 4px 7px; text-align: center; }
.iv-num {
    display: block; font-size: 24px; font-weight: 700; line-height: 1.15;
    font-variant-numeric: tabular-nums; color: var(--green);
}
.iv-num.zero { color: #98989f; font-weight: 600; }
.iv-num.empty { color: #4c4c51; font-weight: 500; }
.iv-unit { display: block; margin-top: 2px; font-size: 11px; color: var(--muted); }
.iv-sentence { margin-top: 10px; font-size: 14px; line-height: 1.6; color: var(--text); }
.iv-sentence.empty { color: var(--muted); font-size: 13px; }
.iv-quick button { padding-left: 6px; padding-right: 6px; font-size: 13.5px; }

/* 轻提示 */
.toast {
    position: fixed;
    left: 50%;
    bottom: calc(var(--nav-h) + 22px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(10px);
    z-index: 60;
    max-width: 78vw;
    padding: 9px 16px;
    border-radius: 999px;
    background: rgba(44, 44, 46, 0.97);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 13px;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.err { color: #ffb4ae; border-color: rgba(255, 69, 58, 0.45); }

/* 计算器 */
.calc-display { background: var(--card); }
.calc-out {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-variant-numeric: tabular-nums;
    font-size: 40px;
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: 0.5px;
    text-align: right;
    word-break: break-all;
    min-height: 48px;
    color: var(--green);
    user-select: text;
    -webkit-user-select: text;
}
.calc-out.error { font-size: 16px; font-weight: 500; color: var(--red); }
.calc-status { min-height: 18px; text-align: right; font-size: 12px; color: var(--muted); }
.calc-status.err { color: var(--red); }
.calc-editor { padding-bottom: 12px; }
#calcInput {
    min-height: 64px;
    resize: none;
    font-family: ui-monospace, Consolas, "Courier New", monospace;
    font-size: 17px;
    line-height: 1.5;
    background: #171719;
}
.hist-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.hist-head h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); }
.hist-head button { min-height: 34px; padding: 4px 10px; font-size: 12px; color: var(--muted); background: transparent; }
.hist-list { display: flex; flex-direction: column; gap: 6px; max-height: 46vh; overflow: auto; }
.hist-empty { margin: 4px 0; font-size: 12.5px; color: #6d6d72; }
.hist-item {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 10px;
    background: var(--card-2);
    border-radius: 10px;
    cursor: pointer;
}
.hist-item:active { background: #313135; }
.hist-main { flex: 1 1 auto; min-width: 0; }
.hist-expr {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 13px; color: #d0d0d5;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hist-res {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 13px; color: var(--green);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hist-time { font-size: 11px; color: #6d6d72; margin-top: 1px; }
.hist-del { flex: 0 0 auto; width: 34px; height: 34px; min-height: 34px; padding: 0; font-size: 15px; color: #8e8e93; background: transparent; border-color: transparent; }

/* 底部导航 */
.tabbar {
    position: fixed;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    z-index: 30;
    width: 100%;
    max-width: 480px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    background: rgba(24, 24, 26, 0.94);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid rgba(255, 255, 255, 0.08);
}
.tab {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px;
    min-height: 44px;
    padding: 4px 0;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 11px;
    border-radius: 10px;
}
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab.active { color: var(--accent); }
@media (max-width: 359px) {
    .cal-cell { min-height: 43px; }
    .calc-out { font-size: 34px; }
    .iv-num { font-size: 21px; }
    .tab { font-size: 10.5px; }
}
</style>
</head>
<body>
<div class="app">
    <header class="topbar">
        <h1>小工具</h1>
        <span class="sub" id="topSub">日历</span>
    </header>

    <main>
        <section class="view active" id="view-calendar">
            <div class="card">
                <div class="jump-row">
                    <input type="text" id="jumpDate" inputmode="numeric" autocomplete="off" maxlength="10"
                           placeholder="20261103" aria-label="跳转日期" onfocus="this.select()"
                           oninput="onJumpInput(event)"
                           onkeydown="if (event.key === 'Enter') { event.preventDefault(); calendarJump(); }">
                    <button class="primary" onclick="calendarJump()">跳转</button>
                </div>
                <div class="jump-hint" id="jumpHint">直接输入 8 位日期，如 20261103</div>
                <div class="chips">
                    <button onclick="calendarJumpToYears(-1)">去年今日</button>
                    <button onclick="calendarJumpToToday()">今天</button>
                    <button onclick="calendarJumpToYears(1)">明年今日</button>
                </div>
            </div>

            <div class="card">
                <div class="cal-toolbar">
                    <button class="nav-btn" onclick="calendarShiftMonth(-1)" aria-label="上月">‹</button>
                    <div class="cal-title" id="calTitle"></div>
                    <button class="nav-btn" onclick="calendarShiftMonth(1)" aria-label="下月">›</button>
                </div>
                <div class="weekdays">
                    <div class="we">日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div class="we">六</div>
                </div>
                <div class="cal-grid" id="calGrid"></div>
            </div>

            <div class="card" id="calInfo"></div>
        </section>

        <section class="view" id="view-add">
            <div class="card">
                <label class="field-label" for="baseDate">起始日期</label>
                <input type="date" id="baseDate" onchange="calcDateAdd()">
                <div class="quick-row">
                    <button onclick="setBaseToday()">今天</button>
                    <button onclick="setBaseFromCalendar()">用日历选中日期</button>
                </div>
            </div>

            <div class="card">
                <div class="stepper">
                    <span class="stepper-label">年</span>
                    <button class="step" onclick="stepValue('addYears',-1)">−</button>
                    <input type="number" id="addYears" value="0" inputmode="numeric" oninput="calcDateAdd()">
                    <button class="step" onclick="stepValue('addYears',1)">+</button>
                </div>
                <div class="stepper">
                    <span class="stepper-label">月</span>
                    <button class="step" onclick="stepValue('addMonths',-1)">−</button>
                    <input type="number" id="addMonths" value="0" inputmode="numeric" oninput="calcDateAdd()">
                    <button class="step" onclick="stepValue('addMonths',1)">+</button>
                </div>
                <div class="stepper">
                    <span class="stepper-label">天</span>
                    <button class="step" onclick="stepValue('addDays',-1)">−</button>
                    <input type="number" id="addDays" value="0" inputmode="numeric" oninput="calcDateAdd()">
                    <button class="step" onclick="stepValue('addDays',1)">+</button>
                </div>
                <div class="stepper">
                    <span class="stepper-label">时</span>
                    <button class="step" onclick="stepValue('addHours',-1)">−</button>
                    <input type="number" id="addHours" value="0" inputmode="numeric" oninput="calcDateAdd()">
                    <button class="step" onclick="stepValue('addHours',1)">+</button>
                </div>
                <div class="stepper" style="margin-bottom:2px;">
                    <span class="stepper-label">分</span>
                    <button class="step" onclick="stepValue('addMinutes',-1)">−</button>
                    <input type="number" id="addMinutes" value="0" inputmode="numeric" oninput="calcDateAdd()">
                    <button class="step" onclick="stepValue('addMinutes',1)">+</button>
                </div>
            </div>

            <div class="card result-card">
                <div class="field-label">结果</div>
                <div class="result-date" id="addResultDate">—</div>
                <div class="result-meta" id="addResultMeta">选择日期后自动计算</div>
                <div class="result-actions">
                    <button class="ghost" onclick="resetAdd()">清零</button>
                    <button class="primary" onclick="copyAddResult()">复制结果</button>
                </div>
            </div>
        </section>

        <section class="view" id="view-interval">
            <div class="card">
                <div class="iv-field">
                    <label class="field-label" for="ivStart">开始时间</label>
                    <input type="text" id="ivStart" class="dt-input" inputmode="numeric" autocomplete="off"
                           spellcheck="false" placeholder="2026-11-03 21:00:00" aria-label="开始时间"
                           oninput="ivUpdate()" onblur="ivOnBlur(this)"
                           onkeydown="if (event.key === 'Enter') { event.preventDefault(); this.blur(); }">
                </div>
                <div class="iv-field">
                    <label class="field-label" for="ivEnd">结束时间</label>
                    <input type="text" id="ivEnd" class="dt-input" inputmode="numeric" autocomplete="off"
                           spellcheck="false" placeholder="2026-11-03 21:00:00" aria-label="结束时间"
                           oninput="ivUpdate()" onblur="ivOnBlur(this)"
                           onkeydown="if (event.key === 'Enter') { event.preventDefault(); this.blur(); }">
                </div>
                <div class="quick-row iv-quick">
                    <button onclick="ivSetNow('start')">开始=现在</button>
                    <button onclick="ivSwap()">交换</button>
                    <button onclick="ivSetNow('end')">结束=现在</button>
                </div>
                <div class="jump-hint" id="ivHint">直接输入数字，如 20261103 或 20261103210000，也可粘贴 2026-11-03 21:00:00</div>
            </div>

            <div class="card result-card">
                <div class="field-label">间隔</div>
                <div class="iv-range">
                    <div><span>开始</span><b id="ivRangeStart">—</b></div>
                    <div><span>结束</span><b id="ivRangeEnd">—</b></div>
                </div>
                <div class="iv-grid">
                    <div class="iv-cell"><span class="iv-num" id="ivYears">—</span><span class="iv-unit">年</span></div>
                    <div class="iv-cell"><span class="iv-num" id="ivMonths">—</span><span class="iv-unit">月</span></div>
                    <div class="iv-cell"><span class="iv-num" id="ivDays">—</span><span class="iv-unit">天</span></div>
                    <div class="iv-cell"><span class="iv-num" id="ivHours">—</span><span class="iv-unit">时</span></div>
                    <div class="iv-cell"><span class="iv-num" id="ivMinutes">—</span><span class="iv-unit">分</span></div>
                    <div class="iv-cell"><span class="iv-num" id="ivSeconds">—</span><span class="iv-unit">秒</span></div>
                </div>
                <div class="iv-sentence empty" id="ivSentence">输入两个时间后自动计算</div>
                <div class="result-meta" id="ivMeta"></div>
                <div class="result-actions">
                    <button class="ghost" onclick="ivReset()">重置</button>
                    <button class="primary" onclick="ivCopy()">复制结果</button>
                </div>
            </div>
        </section>

        <section class="view" id="view-calc">
            <div class="card calc-display">
                <div class="calc-out" id="calcOut" onclick="calcCopyResult()">0</div>
                <div class="calc-status" id="calcStatus">输入算式后自动计算，点结果可复制</div>
            </div>

            <div class="card calc-editor">
                <textarea id="calcInput" spellcheck="false" autocomplete="off" autocapitalize="off"
                          enterkeyhint="done" rows="2"
                          oninput="calcOnInput()"
                          onkeydown="calcShortcut(event)"
                          placeholder="输入或粘贴算式，例如 (12+3.5)*4/2"></textarea>
            </div>

            <div class="card">
                <div class="hist-head">
                    <h2>计算记录</h2>
                    <button onclick="histClearAll()">清空记录</button>
                </div>
                <div class="hist-list" id="histList"></div>
                <p class="hist-empty" id="histEmpty">还没有记录，算完自动保存在这里（同一算式只留最新一条）。</p>
            </div>
        </section>
    </main>

    <nav class="tabbar">
        <button class="tab active" data-view="calendar" onclick="switchView('calendar')">
            <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 9.5h17"/></svg>
            <span>日历</span>
        </button>
        <button class="tab" data-view="add" onclick="switchView('add')">
            <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 9.5h17M12 12.6v5M9.5 15.1h5"/></svg>
            <span>日期加减</span>
        </button>
        <button class="tab" data-view="interval" onclick="switchView('interval')">

<script>
const VIEW_KEY = "miniTool.view.v1";
const VIEW_TITLES = { calendar: "日历", add: "日期加减", interval: "时间间隔", calc: "计算器" };
let currentView = "";

function switchView(name, save) {
    if (currentView === "calc" && name !== "calc") calcCommit();
    currentView = name;
    document.querySelectorAll(".view").forEach(function (v) {
        v.classList.toggle("active", v.id === "view-" + name);
    });
    document.querySelectorAll(".tab").forEach(function (t) {
        t.classList.toggle("active", t.dataset.view === name);
    });
    const sub = document.getElementById("topSub");
    if (sub) sub.textContent = VIEW_TITLES[name] || "";
    if (save !== false) {
        try { localStorage.setItem(VIEW_KEY, name); } catch (e) {}
    }
    window.scrollTo(0, 0);
}

function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
}

const calendarState = { year: 0, month: 0, selected: null };
const WEEK_NAMES = ["日", "一", "二", "三", "四", "五", "六"];

function lunarMonthName(month, isLeap) {
    const names = ["正", "二", "三", "四", "五", "六", "七", "八", "九", "十", "冬", "腊"];
    return (isLeap ? "闰" : "") + (names[month - 1] || (month + "")) + "月";
}

function lunarDayName(day) {
    const cn = ["一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];
    if (day === 10) return "初十";
    if (day < 10) return "初" + cn[day - 1];
    if (day < 20) return "十" + cn[day - 11];
    if (day === 20) return "二十";
    if (day < 30) return "廿" + cn[day - 21];
    return "三十";
}

function lunarInfo(date) {
    const empty = { text: "", detail: "", raw: null, term: "" };
    if (!window.chinese_lunar_calendar || typeof window.chinese_lunar_calendar.getLunar !== "function") return empty;
    if (date.year() < 1901 || date.year() > 2100) return empty;
    try {
        const lunar = window.chinese_lunar_calendar.getLunar(date.year(), date.month() + 1, date.date());
        if (!lunar) return empty;
        const term = lunar.solarTerm || "";
        const monthText = lunarMonthName(lunar.lunarMonth, lunar.isLeap);
        const detail = monthText + lunarDayName(lunar.lunarDate);
        const text = term ? term : (lunar.lunarDate === 1 ? monthText : lunarDayName(lunar.lunarDate));
        return { text: text, detail: detail, raw: lunar, term: term };
    } catch (e) {
        return empty;
    }
}

function calendarParseDate(raw) {
    const text = String(raw == null ? "" : raw).trim();
    if (!text) return null;
    const formats = ["YYYY-MM-DD", "YYYY-M-D", "YYYY/M/D", "YYYY.M.D", "YYYYMMDD", "YYYY年M月D日"];
    for (let i = 0; i < formats.length; i++) {
        const d = moment(text, formats[i], true);
        if (d.isValid()) return d;
    }
    return null;
}

function calendarInit() {
    const today = moment();
    document.getElementById("jumpDate").value = today.format("YYYY-MM-DD");
    calendarShow(today.year(), today.month() + 1, today.date());
}

function calendarShow(year, month, day) {
    calendarState.year = year;
    calendarState.month = month;
    calendarState.selected = (day == null) ? null : moment([year, month - 1, day]);
    renderCalendar();
    renderCalendarInfo();
}

function renderCalendar() {
    const year = calendarState.year;
    const month = calendarState.month;
    const first = moment([year, month - 1, 1]);
    const start = first.clone().subtract(first.day(), "days");
    const todayStr = moment().format("YYYY-MM-DD");
    const selectedStr = calendarState.selected ? calendarState.selected.format("YYYY-MM-DD") : "";

    document.getElementById("calTitle").textContent = year + "年" + month + "月";

    let html = "";
    for (let i = 0; i < 42; i++) {
        const d = start.clone().add(i, "days");
        const dateStr = d.format("YYYY-MM-DD");
        const dow = d.day();
        const cls = ["cal-cell"];
        if (d.year() !== year || d.month() + 1 !== month) cls.push("other");
        if (dow === 0 || dow === 6) cls.push("weekend");
        if (dateStr === todayStr) cls.push("today");
        if (dateStr === selectedStr) cls.push("selected");
        const lunar = lunarInfo(d);
        html += '<div class="' + cls.join(" ") + '" data-date="' + dateStr + '" onclick="calendarPickDate(\'' + dateStr + '\')">' +
            '<span class="num">' + d.date() + "</span>" +
            '<span class="lunar' + (lunar.term ? " term" : "") + '">' + escapeHtml(lunar.text) + "</span>" +
            "</div>";
    }
    document.getElementById("calGrid").innerHTML = html;
}

function renderCalendarInfo() {
    const box = document.getElementById("calInfo");
    const sel = calendarState.selected;
    if (!sel) {
        box.innerHTML = '<div class="info-line">点日历中的任意日期查看详情</div>';
        return;
    }
    const diff = sel.clone().startOf("day").diff(moment().startOf("day"), "days");
    let diffText = "就是今天";
    if (diff > 0) diffText = "距今还有 " + diff + " 天";
    else if (diff < 0) diffText = "距今已过 " + (-diff) + " 天";

    const lunar = lunarInfo(sel);
    let lunarText = "";
    if (lunar.raw) {
        lunarText = "农历 " + lunar.detail;
        if (lunar.term) lunarText += " · 节气 " + lunar.term;
        const ganzhi = String(lunar.raw.lunarYear || "").replace("年", "") + String(lunar.raw.zodiac || "");
        if (ganzhi) lunarText += "（" + ganzhi + "年）";
    }

    let html = '<div class="info-line"><b>' + sel.format("YYYY-MM-DD") + "</b> 星期" + WEEK_NAMES[sel.day()] +
        " · 第 " + sel.isoWeek() + " 周</div>";
    html += '<div class="info-line">' + diffText + " · 当年第 " + sel.dayOfYear() + " 天</div>";
    if (lunarText) html += '<div class="info-line">' + escapeHtml(lunarText) + "</div>";
    html += '<div class="info-actions">' +
        '<button onclick="useSelectedForAdd()">用这个日期做加减</button>' +
        '<button onclick="copySelectedDate()">复制日期</button>' +
        "</div>";
    box.innerHTML = html;
}

function calendarPickDate(dateStr) {
    const d = moment(dateStr, "YYYY-MM-DD", true);
    if (!d.isValid()) return;
    if (d.year() !== calendarState.year || d.month() + 1 !== calendarState.month) {
        calendarShow(d.year(), d.month() + 1, d.date());
    } else {
        calendarState.selected = d;
        renderCalendar();
        renderCalendarInfo();
    }
    const jumpEl = document.getElementById("jumpDate");
    jumpEl.classList.remove("invalid");
    jumpEl.value = d.format("YYYY-MM-DD");
    setJumpHint("");
}

function setJumpHint(text, isError) {
    const hint = document.getElementById("jumpHint");
    if (!hint) return;
    hint.textContent = text || "直接输入 8 位日期，如 20261103";
    hint.className = "jump-hint" + (isError ? " err" : "");
}

// 输满 8 位数字（或带分隔符的完整日期）就自动跳转
function onJumpInput(event) {
    const el = event.target;
    el.classList.remove("invalid");
    if (el.value.replace(/\D/g, "").length === 8) {
        calendarJump(true);
    } else {
        setJumpHint("");
    }
}

function calendarJump(auto) {
    const input = document.getElementById("jumpDate");
    const raw = input.value.trim();
    if (!raw) {
        if (auto) return;
        const today = moment();
        input.classList.remove("invalid");
        input.value = today.format("YYYY-MM-DD");
        setJumpHint("");
        calendarShow(today.year(), today.month() + 1, today.date());
        return;
    }
    const d = calendarParseDate(raw);
    if (!d) {
        input.classList.add("invalid");
        setJumpHint("日期格式不对，试试 20261103 或 2026-11-03", true);
        return;
    }
    input.classList.remove("invalid");
    input.value = d.format("YYYY-MM-DD");
    setJumpHint("");
    calendarShow(d.year(), d.month() + 1, d.date());
    if (auto) input.blur(); // 输完自动收起手机键盘，露出日历
}

function calendarJumpToDate(d) {
    const input = document.getElementById("jumpDate");
    input.classList.remove("invalid");
    input.value = d.format("YYYY-MM-DD");
    setJumpHint("");
    calendarShow(d.year(), d.month() + 1, d.date());
}

// 切换年份的基准：优先用输入框里能解析出的日期，其次用日历里选中的日期，都没有才退回今天
function calendarBaseDate() {
    const input = document.getElementById("jumpDate");
    const typed = input ? calendarParseDate(input.value) : null;
    return typed || calendarState.selected || moment();
}

// 去年今日 / 明年今日：按所选（或输入）的日期切换年份，而不是按今天
function calendarJumpToYears(delta) {
    const base = calendarBaseDate();
    calendarJumpToDate(base.clone().add(delta, "years"));
}

function calendarJumpToToday() {
    calendarJumpToDate(moment());
}

function calendarShiftMonth(delta) {
    const base = moment([calendarState.year, calendarState.month - 1, 1]).add(delta, "months");
    let day = null;
    if (calendarState.selected) day = Math.min(calendarState.selected.date(), base.daysInMonth());
    calendarShow(base.year(), base.month() + 1, day);
}

function useSelectedForAdd() {
    if (!calendarState.selected) return;
    document.getElementById("baseDate").value = calendarState.selected.format("YYYY-MM-DD");
    resetAddSteps();
    calcDateAdd();
    switchView("add");
}

function copySelectedDate() {
    if (!calendarState.selected) return;
    copyText(calendarState.selected.format("YYYY-MM-DD"), "日期已复制");
}

function todayStr() { return moment().format("YYYY-MM-DD"); }

function setBaseToday() {
    document.getElementById("baseDate").value = todayStr();
    calcDateAdd();
}

function setBaseFromCalendar() {
    if (calendarState.selected) {
        document.getElementById("baseDate").value = calendarState.selected.format("YYYY-MM-DD");
    } else {
        document.getElementById("baseDate").value = todayStr();
    }
    calcDateAdd();
}

function stepValue(id, delta) {
    const el = document.getElementById(id);
    const v = (parseInt(el.value, 10) || 0) + delta;
    el.value = v;
    calcDateAdd();
}

function resetAddSteps() {
    ["addYears", "addMonths", "addDays", "addHours", "addMinutes"].forEach(function (id) {
        document.getElementById(id).value = "0";
    });
}

function calcDateAdd() {
    const input = document.getElementById("baseDate");
    if (!input.value) input.value = todayStr();
    const base = moment(input.value, "YYYY-MM-DD", true);
    const dateEl = document.getElementById("addResultDate");
    const metaEl = document.getElementById("addResultMeta");

    if (!base.isValid()) {
        dateEl.textContent = "—";
        metaEl.textContent = "日期无效，请重新选择";
        return;
    }

    const result = base.clone()
        .add(parseInt(document.getElementById("addYears").value, 10) || 0, "years")
        .add(parseInt(document.getElementById("addMonths").value, 10) || 0, "months")
        .add(parseInt(document.getElementById("addDays").value, 10) || 0, "days")
        .add(parseInt(document.getElementById("addHours").value, 10) || 0, "hours")
        .add(parseInt(document.getElementById("addMinutes").value, 10) || 0, "minutes");

    const diff = result.clone().startOf("day").diff(moment().startOf("day"), "days");
    let diffText = "就是今天";
    if (diff > 0) diffText = "距今还有 " + diff + " 天";
    else if (diff < 0) diffText = "距今已过 " + (-diff) + " 天";

    const lunar = lunarInfo(result);
    dateEl.textContent = result.format("YYYY-MM-DD");
    metaEl.textContent = "星期" + WEEK_NAMES[result.day()] + " · " + diffText +
        (lunar.detail ? " · 农历 " + lunar.detail : "");
}

function copyAddResult() {
    const text = document.getElementById("addResultDate").textContent.trim();
    if (!text || text === "—") return;
    copyText(text, "结果已复制");
}

function resetAdd() {
    resetAddSteps();
    setBaseToday();
}

/* ---------- 时间间隔 ---------- */
const IV_IDS = ["ivYears", "ivMonths", "ivDays", "ivHours", "ivMinutes", "ivSeconds"];
const IV_UNITS = ["年", "个月", "天", "小时", "分", "秒"];
const IV_HINT = "直接输入数字，如 20261103 或 20261103210000，也可粘贴 2026-11-03 21:00:00";
const IV_WEEK = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];

// 中文单位转成数字：2026年11月3日21时30分 -> 2026-11-3 21:30
function ivNormalize(raw) {
    let s = String(raw == null ? "" : raw)
        .replace(/[：]/g, ":")
        .replace(/[／]/g, "/")
        .replace(/[．。]/g, ".")
        .replace(/[Tt]/g, " ")
        .replace(/[，,、]/g, " ");
    s = s.replace(/(\d{4})\s*年/g, "$1-")
        .replace(/(\d{1,2})\s*月/g, "$1-")
        .replace(/(\d{1,2})\s*[日号]/g, "$1 ")
        .replace(/(\d{1,2})\s*[时点]/g, "$1:")
        .replace(/(\d{1,2})\s*分/g, "$1:")
        .replace(/(\d{1,2})\s*秒/g, "$1");
    return s.replace(/\s+/g, " ").trim();
}

// 返回 { status: empty | partial | error | ok, value, hasTime, message }
// partial 表示还在输入中（例如只打了 202611），不提示红色错误
function ivParse(raw) {
    const text = ivNormalize(raw);
    if (!text) return { status: "empty" };

    // 纯数字：20261103 / 2026110321 / 202611032130 / 20261103213000
    if (/^[\d\s]+$/.test(text)) {
        const digits = text.replace(/\s/g, "");
        const n = digits.length;
        if (n < 8 || n === 9 || n === 11 || n === 13) return { status: "partial" };
        if (n > 14) return { status: "error", message: "数字最多 14 位（年月日时分秒）" };
        return ivBuild(
            digits.slice(0, 4), digits.slice(4, 6), digits.slice(6, 8),
            digits.slice(8, 10), digits.slice(10, 12), digits.slice(12, 14),
            n > 8
        );
    }

    const m = text.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})(?: (\d{0,2})(?::(\d{0,2})(?::(\d{0,2}))?)?)?$/);
    if (!m) {
        // 年份都还没打全时不算错，继续输入就好；一个数字都没有才算错
        const digits = text.replace(/\D/g, "");
        if (digits.length && digits.length < 8) return { status: "partial" };
        return { status: "error", message: "格式不对，试试 2026-11-03 21:30:00" };
    }
    return ivBuild(m[1], m[2], m[3], m[4], m[5], m[6], m[4] != null && m[4] !== "");
}

function ivBuild(y, mo, d, hh, mi, ss, hasTime) {
    const year = parseInt(y, 10);
    const month = parseInt(mo, 10);
    const day = parseInt(d, 10);
    const hour = parseInt(hh, 10) || 0;
    const minute = parseInt(mi, 10) || 0;
    const second = parseInt(ss, 10) || 0;

    if (!(year >= 1 && year <= 9999)) return { status: "error", message: "年份要在 1–9999 之间" };
    if (!(month >= 1 && month <= 12)) return { status: "error", message: "月份要在 1–12 之间" };
    if (!(day >= 1 && day <= 31)) return { status: "error", message: "日期要在 1–31 之间" };
    if (!(hour <= 23)) return { status: "error", message: "小时要在 0–23 之间" };
    if (!(minute <= 59)) return { status: "error", message: "分钟要在 0–59 之间" };
    if (!(second <= 59)) return { status: "error", message: "秒要在 0–59 之间" };

    // 2026-02-30 这种会自动跑到 3 月，回读一遍各字段就能识破
    const value = moment([year, month - 1, day, hour, minute, second]);
    if (!value.isValid() || value.year() !== year || value.month() !== month - 1 ||
        value.date() !== day || value.hour() !== hour || value.minute() !== minute ||
        value.second() !== second) {
        return { status: "error", message: "这个日期不存在，检查一下" };
    }
    return { status: "ok", value: value, hasTime: !!hasTime };
}

// 按日历算差：先整年、再整月、再天，最后剩时分秒（from <= to）
function ivDiff(from, to) {
    let years = to.year() - from.year();
    let cursor = from.clone().add(years, "years");
    if (cursor.isAfter(to)) {
        years -= 1;
        cursor = from.clone().add(years, "years");
    }
    let months = (to.year() - cursor.year()) * 12 + (to.month() - cursor.month());
    let mark = cursor.clone().add(months, "months");
    if (mark.isAfter(to)) {
        months -= 1;
        mark = cursor.clone().add(months, "months");
    }
    let days = to.diff(mark, "days");
    let base = mark.clone().add(days, "days");
    let rest = to.valueOf() - base.valueOf();
    if (rest < 0) { // 夏令时之类的边界，退一天再补
        days -= 1;
        base = mark.clone().add(days, "days");
        rest = to.valueOf() - base.valueOf();
    }
    const hours = Math.floor(rest / 3600000);
    rest -= hours * 3600000;
    const minutes = Math.floor(rest / 60000);
    rest -= minutes * 60000;
    const seconds = Math.floor(rest / 1000);
    return {
        list: [Math.max(years, 0), Math.max(months, 0), Math.max(days, 0), hours, minutes, seconds],
        totalMs: to.valueOf() - from.valueOf()
    };
}

// 总时长拆成天/时/分/秒
function ivSplitTotal(ms) {
    const days = Math.floor(ms / 86400000);
    let rest = ms - days * 86400000;
    const hours = Math.floor(rest / 3600000);
    rest -= hours * 3600000;
    const minutes = Math.floor(rest / 60000);
    rest -= minutes * 60000;
    const seconds = Math.floor(rest / 1000);
    return [days, hours, minutes, seconds];
}

function ivGroup(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

function ivStamp(d) {
    return d.format("YYYY-MM-DD HH:mm:ss") + " " + IV_WEEK[d.day()];
}

function ivSetCells(list) {
    IV_IDS.forEach(function (id, i) {
        const el = document.getElementById(id);
        if (!el) return;
        const v = list ? list[i] : null;
        el.textContent = v == null ? "—" : String(v);
        el.className = "iv-num" + (v == null ? " empty" : v === 0 ? " zero" : "");
    });
}

function ivSetSentence(text, isEmpty) {
    const el = document.getElementById("ivSentence");
    el.textContent = text;
    el.className = "iv-sentence" + (isEmpty ? " empty" : "");
}

function ivSetHint(text, isError) {
    const el = document.getElementById("ivHint");
    if (!el) return;
    el.textContent = text || IV_HINT;
    el.className = "jump-hint" + (isError ? " err" : "");
}

function ivSetRange(start, end) {
    document.getElementById("ivRangeStart").textContent = start ? ivStamp(start) : "—";
    document.getElementById("ivRangeEnd").textContent = end ? ivStamp(end) : "—";
}

// 没有结果时的统一占位
function ivClear(placeholder, hint, hintError) {
    ivSetCells(null);
    ivSetSentence(placeholder, true);
    document.getElementById("ivMeta").textContent = "";
    ivSetHint(hint, hintError);
}

function ivUpdate() {
    const startEl = document.getElementById("ivStart");
    const endEl = document.getElementById("ivEnd");
    if (!startEl || !endEl) return;

    const s = ivParse(startEl.value);
    const e = ivParse(endEl.value);

    // 只有确定输错才标红，边打边算时不闪红
    startEl.classList.toggle("invalid", s.status === "error");
    endEl.classList.toggle("invalid", e.status === "error");
    ivSetRange(s.status === "ok" ? s.value : null, e.status === "ok" ? e.value : null);

    if (s.status === "error" || e.status === "error") {
        const bad = s.status === "error" ? s : e;
        ivClear((bad === s ? "开始时间" : "结束时间") + "格式不对", bad.message, true);
        return;
    }
    if (s.status !== "ok" || e.status !== "ok") {
        if (s.status === "partial" || e.status === "partial") {
            ivClear("还没输完，继续输入…", "还差一点，例如 20261103210000", false);
        } else {
            ivClear(s.status === "empty" ? "再输入开始时间" : "再输入结束时间", "", false);
        }
        return;
    }

    ivSetHint("", false);

    // 结束早于开始时，按先后顺序取正数，并提示一句
    let from = s.value;
    let to = e.value;
    let reversed = false;
    if (to.isBefore(from)) {
        reversed = true;
        const tmp = from;
        from = to;
        to = tmp;
    }

    const diff = ivDiff(from, to);
    ivSetCells(diff.list);
    ivSetSentence(diff.list.map(function (n, i) { return n + " " + IV_UNITS[i]; }).join(" "), false);

    const total = ivSplitTotal(diff.totalMs);
    const totalText = "折合 " + total[0] + " 天 " + total[1] + " 小时 " + total[2] + " 分 " + total[3] + " 秒";
    document.getElementById("ivMeta").textContent =
        (reversed ? "结束早于开始，已按先后顺序计算 · " : "") +
        totalText + " · 共 " + ivGroup(Math.floor(diff.totalMs / 1000)) + " 秒";
}

// 失焦时把输入补成标准写法，方便一眼确认
function ivOnBlur(el) {
    const p = ivParse(el.value);
    if (p.status === "ok") el.value = p.value.format(p.hasTime ? "YYYY-MM-DD HH:mm:ss" : "YYYY-MM-DD");
    ivUpdate();
}

function ivSetNow(which) {
    const el = document.getElementById(which === "start" ? "ivStart" : "ivEnd");
    el.value = moment().format("YYYY-MM-DD HH:mm:ss");
    ivUpdate();
}

function ivSwap() {
    const a = document.getElementById("ivStart");
    const b = document.getElementById("ivEnd");
    const tmp = a.value;
    a.value = b.value;
    b.value = tmp;
    ivUpdate();
}

function ivSetDefaults() {
    const now = moment();
    document.getElementById("ivStart").value = now.clone().startOf("day").format("YYYY-MM-DD HH:mm:ss");
    document.getElementById("ivEnd").value = now.format("YYYY-MM-DD HH:mm:ss");
    ivUpdate();
}

function ivReset() {
    ivSetDefaults();
}

function ivCopy() {
    const sentence = document.getElementById("ivSentence");
    if (sentence.classList.contains("empty")) {
        showToast("还没有可复制的结果", true);
        return;
    }
    const start = document.getElementById("ivRangeStart").textContent.trim();
    const end = document.getElementById("ivRangeEnd").textContent.trim();
    const meta = document.getElementById("ivMeta").textContent.trim();
    const text = start + " → " + end + "\n间隔 " + sentence.textContent.trim() + (meta ? "\n" + meta : "");
    copyText(text, "结果已复制");
}

function calcNormalize(text) {
    const map = {
        "＋": "+", "－": "-", "−": "-", "–": "-", "—": "-",
        "＊": "*", "×": "*", "✕": "*", "✖": "*", "·": "*",
        "／": "/", "÷": "/",
        "（": "(", "）": ")", "【": "(", "】": ")",
        "．": ".", "　": " "
    };
    for (let d = 0; d < 10; d++) map[String.fromCharCode(0xFF10 + d)] = String(d);
    let out = "";
    for (const ch of String(text)) out += (map[ch] !== undefined ? map[ch] : ch);
    return out;
}

function calcTokenize(expr) {
    const tokens = [];
    let i = 0;
    while (i < expr.length) {
        const ch = expr[i];
        if (/\s/.test(ch)) { i++; continue; }
        if (/[0-9.]/.test(ch)) {
            const start = i;
            let dots = 0;
            while (i < expr.length && /[0-9.]/.test(expr[i])) {
                if (expr[i] === "." && ++dots > 1) throw new Error("数字格式错误：" + expr.slice(start, i + 1));
                i++;
            }
            const numText = expr.slice(start, i);
            if (numText === ".") throw new Error("数字格式错误：.");
            tokens.push({ type: "num", value: parseFloat(numText), text: numText });
            continue;
        }
        if ("+-*/()".indexOf(ch) > -1) {
            tokens.push({ type: "op", value: ch });
            i++;
            continue;
        }
        throw new Error("不支持的字符：" + ch);
    }
    return tokens;
}

function calcParse(tokens) {
    let pos = 0;
    function peek() { return tokens[pos]; }
    function next() { return tokens[pos++]; }

    function parseExpr() {
        let value = parseTerm();
        while (peek() && peek().type === "op" && (peek().value === "+" || peek().value === "-")) {
            const op = next().value;
            const rhs = parseTerm();
            value = op === "+" ? value + rhs : value - rhs;
        }
        return value;
    }
    function parseTerm() {
        let value = parseUnary();
        while (peek() && peek().type === "op" && (peek().value === "*" || peek().value === "/")) {
            const op = next().value;
            const rhs = parseUnary();
            if (op === "/") {
                if (rhs === 0) throw new Error("除数不能为 0");
                value = value / rhs;
            } else {
                value = value * rhs;
            }
        }
        return value;
    }
    function parseUnary() {
        const t = peek();
        if (t && t.type === "op" && (t.value === "+" || t.value === "-")) {
            next();
            const v = parseUnary();
            return t.value === "-" ? -v : v;
        }
        return parsePrimary();
    }
    function parsePrimary() {
        const t = peek();
        if (!t) throw new Error("表达式不完整");
        if (t.type === "num") { next(); return t.value; }
        if (t.value === "(") {
            next();
            const v = parseExpr();
            const close = peek();
            if (!close || close.value !== ")") throw new Error("括号不匹配，缺少右括号");
            next();
            return v;
        }
        if (t.value === ")") throw new Error("括号不匹配，多余的右括号");
        throw new Error("符号位置错误：" + t.value);
    }

    if (!tokens.length) throw new Error("请输入算式");
    const result = parseExpr();
    if (pos < tokens.length) {
        const t = tokens[pos];
        if (t.value === ")") throw new Error("括号不匹配，多余的右括号");
        throw new Error("无法解析：" + (t.text || t.value));
    }
    return result;
}

function calcFormat(n) {
    if (Number.isNaN(n)) return "NaN";
    if (!Number.isFinite(n)) return n > 0 ? "∞" : "-∞";
    if (n === 0) return "0";
    const abs = Math.abs(n);
    if (abs >= 1e16 || abs < 1e-9) {
        return n.toExponential(10).replace(/\.?0+e/, "e").replace("e+", "e");
    }
    return String(Number(n.toPrecision(12)));
}

const CALC_HINT = "输入算式后自动计算，点结果可复制";
const CALC_INCOMPLETE = ["表达式不完整", "括号不匹配，缺少右括号"];
// 已经写进记录的那条算式，避免同一个算式被反复保存
let calcCommitted = "";

function setCalcStatus(text, isError) {
    const el = document.getElementById("calcStatus");
    el.textContent = text || CALC_HINT;
    el.className = "calc-status" + (isError ? " err" : "");
}

function calcIncomplete(msg) {
    return CALC_INCOMPLETE.some(function (s) { return msg.indexOf(s) === 0; });
}

// 边输边算：返回结果文本，出错返回 null
function calcUpdate() {
    const input = document.getElementById("calcInput");
    const out = document.getElementById("calcOut");
    const raw = input.value;

    if (!raw.trim()) {
        out.textContent = "0";
        out.className = "calc-out";
        setCalcStatus("");
        return null;
    }

    let text;
    try {
        text = calcFormat(calcParse(calcTokenize(calcNormalize(raw))));
    } catch (e) {
        const msg = (e && e.message) ? e.message : String(e);
        // 正在打字、算式还没写完的时候不闪红色报错
        if (calcIncomplete(msg)) {
            setCalcStatus("继续输入…");
            return null;
        }
        out.textContent = "计算出错";
        out.className = "calc-out error";
        setCalcStatus(msg, true);
        return null;
    }

    out.textContent = text;
    out.className = "calc-out";
    setCalcStatus("计算完成");
    return text;
}

function calcOnInput() {
    calcCommitted = "";
    calcUpdate();
}

// 输完了（回车 / 换到别的页面 / 应用切后台）才存记录
function calcCommit() {
    const input = document.getElementById("calcInput");
    const expr = input.value.trim();
    if (!expr || expr === calcCommitted) return;
    const result = calcUpdate();
    if (result == null) return;
    calcCommitted = expr;
    histAdd(expr, result);
}

function calcShortcut(e) {
    if (e.key === "Enter" || e.keyCode === 13) {
        e.preventDefault(); // 算式只有一行，不用换行
        calcCommit();
    }
}

function calcCopyResult() {
    const text = document.getElementById("calcOut").textContent.trim();
    if (!text || text === "0" || text === "计算出错") return;
    copyText(text, "结果已复制");
}

const HIST_KEY = "miniTool.calcHistory.v1";
const HIST_LIMIT = 20;
let hist = [];

function histLoad() {
    hist = [];
    const seen = Object.create(null);
    try {
        const arr = JSON.parse(localStorage.getItem(HIST_KEY) || "[]");
        if (!Array.isArray(arr)) return;
        arr.forEach(function (it) {
            if (!it || typeof it.expr !== "string" || typeof it.result !== "string") return;
            const expr = it.expr.trim();
            if (!expr || seen[expr]) return; // 以算式为唯一键：同一条只保留最新的
            seen[expr] = true;
            hist.push({ expr: expr, result: it.result, time: typeof it.time === "string" ? it.time : "" });
        });
    } catch (e) {
        hist = [];
    }
    hist = hist.slice(0, HIST_LIMIT);
}

function histSave() {
    try { localStorage.setItem(HIST_KEY, JSON.stringify(hist)); } catch (e) {}
}

// 算式就是记录的唯一键：已有同样算式的记录会被替换，只保留最新一条
function histAdd(expr, result) {
    const key = String(expr == null ? "" : expr).trim();
    if (!key) return;
    hist = hist.filter(function (it) { return it.expr !== key; });
    hist.unshift({ expr: key, result: result, time: moment().format("MM-DD HH:mm") });
    hist = hist.slice(0, HIST_LIMIT);
    histSave();
    histRender();
}

function histRemove(index) {
    hist.splice(index, 1);
    histSave();
    histRender();
}

function histClearAll() {
    if (!hist.length) return;
    hist = [];
    histSave();
    histRender();
}

// 点记录只把算式放进输入框，不聚焦输入框，避免弹出输入法
function histUse(index) {
    const item = hist[index];
    if (!item) return;
    const input = document.getElementById("calcInput");
    if (document.activeElement === input) input.blur();
    input.value = item.expr;
    const end = item.expr.length;
    try { input.setSelectionRange(end, end); } catch (e) {}
    calcCommitted = item.expr; // 记录里已有的算式不再重复入表
    calcUpdate();
}

function histRender() {
    const list = document.getElementById("histList");
    const empty = document.getElementById("histEmpty");
    if (!hist.length) {
        list.innerHTML = "";
        empty.style.display = "block";
        return;
    }
    empty.style.display = "none";
    list.innerHTML = hist.map(function (it, i) {
        return '<div class="hist-item" onclick="histUse(' + i + ')">' +
            '<div class="hist-main">' +
            '<div class="hist-expr">' + escapeHtml(it.expr) + "</div>" +
            '<div class="hist-res">= ' + escapeHtml(it.result) + "</div>" +
            '<div class="hist-time">' + escapeHtml(it.time) + "</div>" +
            "</div>" +
            '<button class="hist-del" onclick="event.stopPropagation();histRemove(' + i + ')" aria-label="删除">✕</button>' +
            "</div>";
    }).join("");
}

function copyText(text, okMsg) {
    const done = function (ok) {
        const msg = ok ? okMsg : "复制失败，请长按手动复制";
        setCalcStatus(msg, !ok);
        showToast(msg, !ok);
    };
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(copyFallback(text)); });
    } else {
        done(copyFallback(text));
    }
}

let toastTimer = 0;
function showToast(text, isError) {
    const el = document.getElementById("toast");
    if (!el) return;
    el.textContent = text;
    el.className = "toast show" + (isError ? " err" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = "toast"; }, 1800);
}

function copyFallback(text) {
    try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.top = "-1000px";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand("copy");
        document.body.removeChild(ta);
        return ok;
    } catch (e) {
        return false;
    }
}

function boot() {
    calendarInit();
    document.getElementById("baseDate").value = todayStr();
    histLoad();
    histRender();
    calcDateAdd();
    ivSetDefaults();
    calcUpdate();
    let saved = "calendar";
    try { saved = localStorage.getItem(VIEW_KEY) || "calendar"; } catch (e) {}
    if (!VIEW_TITLES[saved]) saved = "calendar";
    switchView(saved, false);
}
boot();

// 应用被切到后台 / 页面关闭前，把正在输入的算式存进记录
window.addEventListener("pagehide", calcCommit);
document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") calcCommit();
});

// PWA：hosting 到 https/localhost 后即可安装并离线使用
if ("serviceWorker" in navigator && location.protocol !== "file:") {
    window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
    });
}
